# ========================================
# TongKey Backend — 通用基础配置
# 各环境共享，不包含敏感/环境特定值
# ========================================

# 默认激活 dev + local（本地开发常用叠加）
# 生产部署通过环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖
# 注意：占位符 ${VAR:a,b} 里逗号会被截断，所以默认值直接硬写
spring:
  application:
    name: tongkey-server
  profiles:
    active: "dev,local"
  threads:
    virtual:
      enabled: true            # 虚拟线程：支撑同步/推送的高并发低开销
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50

# API 文档（各环境都启用，生产可按需关闭）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# 健康检查 / 指标
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# 业务通用参数（各环境相同）
tongkey:
  sync:
    default-batch-size: 500
    query-timeout-seconds: 300
  push:
    connect-timeout-seconds: 10
    read-timeout-seconds: 30
  openapi:
    signature-max-skew-seconds: 300   # 签名时间戳允许的最大偏移，防重放
  oauth2:
    # JWT/会话 Cookie 的 HS256 签名密钥：开发兜底默认值；生产必须通过 TONGKEY_OAUTH_JWT_SECRET 注入
    jwt-secret: ${TONGKEY_OAUTH_JWT_SECRET:tongkey-oauth2-dev-only-secret-do-not-use-in-prod}
    issuer: tongkey
    access-token-ttl-seconds: 7200    # access_token 有效期 2 小时
    refresh-token-ttl-days: 30        # refresh_token 有效期 30 天
    code-ttl-seconds: 600             # 授权码有效期 10 分钟
    session-ttl-seconds: 1800         # 授权页登录会话 30 分钟
