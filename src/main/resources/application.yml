# ========================================
# TongKey Backend — 通用基础配置
# 各环境共享，不包含敏感/环境特定值
# ========================================

# 默认激活 dev + local（本地开发常用叠加）
# 生产部署通过环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖
# 注意：占位符 ${VAR:a,b} 里逗号会被截断，所以默认值直接硬写
spring:
  application:
    name: tongkey-server
  profiles:
    active: "dev,local"
  threads:
    virtual:
      enabled: true            # 虚拟线程：支撑同步/推送的高并发低开销
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50

# API 文档（各环境都启用，生产可按需关闭）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# 健康检查 / 指标
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# 业务通用参数（各环境相同）
tongkey:
  sync:
    default-batch-size: 500
    query-timeout-seconds: 300
  push:
    connect-timeout-seconds: 10
    read-timeout-seconds: 30
  openapi:
    signature-max-skew-seconds: 300   # 签名时间戳允许的最大偏移，防重放
