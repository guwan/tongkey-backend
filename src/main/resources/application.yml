# ========================================
# TongKey Backend — 通用基础配置
# 各环境共享，不包含敏感/环境特定值
# ========================================

# 默认激活 dev 环境，可通过环境变量覆盖
# 例：SPRING_PROFILES_ACTIVE=prod,local  (dev 作为基础 + local 叠加覆盖)
# 例：SPRING_PROFILES_ACTIVE=dev,local  (dev + local)
spring:
  application:
    name: tongkey-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true            # 虚拟线程：支撑同步/推送的高并发低开销
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50

# API 文档（各环境都启用，生产可按需关闭）
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# 健康检查 / 指标
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# 业务通用参数（各环境相同）
tongkey:
  sync:
    default-batch-size: 500
    query-timeout-seconds: 300
  push:
    connect-timeout-seconds: 10
    read-timeout-seconds: 30
  openapi:
    signature-max-skew-seconds: 300   # 签名时间戳允许的最大偏移，防重放
